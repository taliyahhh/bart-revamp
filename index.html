<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BART Revamp</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="map-wrap">
    <svg id="map" viewBox="0 0 1183 1008" aria-label="BART system map"></svg>

    <div class="card trip">
      <div class="card-head">Plan a Trip</div>
      <div class="card-body">
        <label>From <select id="from"></select></label>
        <label>To <select id="to"></select></label>
        <div id="trip" class="trip-out"></div>
        <button id="clear">Clear</button>
      </div>
    </div>
  </main>
  <p class="footer">BART Revamp is a fan project and is not affiliated with BART. Check bart.gov for current service.</p>

  <script src="data/bart.js"></script>
  <script src="app.js"></script>
</body>
</html>
